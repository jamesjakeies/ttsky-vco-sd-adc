# Tiny Tapeout project information
project:
  title:        "CEDEC V1: 1.8V VCO-Based Sigma-Delta ADC"
  author:       "Jakie Wang (Supervisor: Assoc. Prof. Dr. Jagadheswaran)"
  discord:      ""
  description:  "Mixed-signal 1.8V VCO-based Sigma-Delta ADC with 7-stage ring VCO, 1-bit quantizer, and 763-cell Sinc3 decimator (SKY130A)."
  language:     "Analog"
  clock_hz:     6000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values for analog projects: 1x2, 2x2

  # How many analog pins does your project use?
  analog_pins: 3        # Valid values: 0 to 6
  uses_vapwr: false     # Set to true if your project uses second analog power supply (VAPWR) in addition to 1.8V (VDPWR)

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_jamesjakeies_vco_sd_adc"

  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "osr_sel[0]"
  ui[1]: "osr_sel[1]"
  ui[2]: "out_sel"
  ui[3]: "dwa_en"
  ui[4]: "cal_en"
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "adc_out[0]"
  uo[1]: "adc_out[1]"
  uo[2]: "adc_out[2]"
  uo[3]: "adc_out[3]"
  uo[4]: "adc_out[4]"
  uo[5]: "adc_out[5]"
  uo[6]: "adc_out[6]"
  uo[7]: "adc_out[7]"

  # Bidirectional pins
  uio[0]: "data_valid"
  uio[1]: "sd_bit_out"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

  # Analog pins - make sure to also set "analog_pins" above, else the pins won't be connected
  ua[0]: "vin_p"
  ua[1]: "vin_n"
  ua[2]: "vbias"
  ua[3]: ""
  ua[4]: ""
  ua[5]: ""

# Do not change!
yaml_version: 6
